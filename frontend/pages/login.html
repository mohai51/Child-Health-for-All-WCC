<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন - WCC শিশু স্বাস্থ্য রেজিস্ট্রি</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .login-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      padding: 36px 30px;
    }
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle-btn:hover {
      color: var(--primary);
    }
  </style>
</head>
<body class="login-page-body" style="display:flex; align-items:center; justify-content:center; min-height:100vh; background: var(--bg-main); padding: 20px;">
  <div class="login-card">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-logo-badge" style="width: 80px; height: 80px; margin: 0 auto 14px; border: 3px solid var(--wcc-gold);">
        <img src="/assets/logo.png" alt="WCC Logo" class="brand-logo-img">
      </div>
      <h1 style="color: var(--primary); font-size: 1.55rem; font-weight:800; margin-bottom: 4px;">উই ক্যান চেঞ্জ (WCC)</h1>
      <p style="color: var(--text-muted); font-size: 0.92rem;">শিশু স্বাস্থ্য রেজিস্ট্রি ও মাল্টি-ক্যাম্প পোর্টাল</p>
    </div>

    <!-- Clean Official Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label required" for="email">ইমেইল বা লগইন আইডি</label>
        <input type="email" id="email" class="form-control" placeholder="যেমন: admin@wcc.org.bd" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label required" for="password">পাসওয়ার্ড</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="আপনার পাসওয়ার্ড লিখুন" required autocomplete="current-password" style="padding-right: 40px;">
          <button type="button" id="toggle-password-btn" class="password-toggle-btn" aria-label="পাসওয়ার্ড দেখুন" title="পাসওয়ার্ড দেখুন">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 18px; font-weight:700; height:46px; font-size:1rem;">
        লগইন করুন (Sign In)
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 16px;">
      🔒 নিরাপদ ও এনক্রিপ্টেড সেশন ব্যবস্থাপনা &bull; WCC
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Toggle password visibility
    const togglePassBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOffIcon = document.getElementById('eye-off-icon');

    if (togglePassBtn && passwordInput) {
      togglePassBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        if (eyeIcon) eyeIcon.style.display = isPassword ? 'none' : 'block';
        if (eyeOffIcon) eyeOffIcon.style.display = isPassword ? 'block' : 'none';
      });
    }

    // Handle real API login submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-submit-btn');
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span>লগইন যাচাই করা হচ্ছে...</span>';

      try {
        const res = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (res && res.success && res.data) {
          const user = res.data.user;
          const token = res.data.token;

          localStorage.setItem('wcc_token', token);
          localStorage.setItem('wcc_user', JSON.stringify(user));
          localStorage.setItem('wcc_active_role', user.role);

          showToast('লগইন সফল হয়েছে! রিডাইরেক্ট করা হচ্ছে...', 'success');

          // Strict role-based redirect
          setTimeout(() => {
            if (user.role === 'DOCTOR') {
              window.location.href = '/pages/consultation.html';
            } else if (user.role === 'REGISTRATION_VOLUNTEER') {
              window.location.href = '/pages/registration.html';
            } else {
              window.location.href = '/pages/dashboard.html';
            }
          }, 600);
        }
      } catch (err) {
        showToast(err.message || 'ইমেইল বা পাসওয়ার্ড সঠিক নয়', 'error');
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
